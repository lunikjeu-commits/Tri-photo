name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org com.lunikapp --project-name tri_photos .
      - name: Config Android (permissions, sans Internet, minSdk, sans R8, JVM, rescan)
        run: |
          python3 - <<'EOF'
          import os, re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          perms = ''.join(
              f'\n    <uses-permission android:name="android.permission.{x}"/>'
              for x in ['MANAGE_EXTERNAL_STORAGE', 'READ_MEDIA_IMAGES',
                        'READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE'])
          perms += '\n    <uses-permission android:name="android.permission.INTERNET" tools:node="remove"/>'
          i = s.index('>', s.index('<manifest')) + 1
          s = s[:i] + perms + s[i:]
          s = re.sub(r'android:label="[^"]*"', 'android:label="Tri Photos"', s)
          open(p, 'w', encoding='utf-8').write(s)
          for g in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(g):
                  t = open(g, encoding='utf-8').read()
                  t = t.replace('flutter.minSdkVersion', '26')
                  if g.endswith('.kts'):
                      t = t.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false', 1)
                  else:
                      t = t.replace('release {', 'release {\n            minifyEnabled false\n            shrinkResources false', 1)
                  open(g, 'w', encoding='utf-8').write(t)
          gp = 'android/gradle.properties'
          if os.path.exists(gp):
              t = open(gp, encoding='utf-8').read()
              if 'kotlin.jvm.target.validation.mode' not in t:
                  t += '\nkotlin.jvm.target.validation.mode=warning\n'
              open(gp, 'w', encoding='utf-8').write(t)
          acts = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)
          if acts:
              a = acts[0]
              first = open(a, encoding='utf-8').readline().strip()
              kt = first + '''

          import android.media.MediaScannerConnection
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lc/media")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "scan") {
                              val paths = call.argument<List<String>>("paths") ?: emptyList()
                              if (paths.isNotEmpty()) {
                                  MediaScannerConnection.scanFile(
                                      applicationContext, paths.toTypedArray(), null, null)
                              }
                              result.success(paths.size)
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          '''
              import textwrap
              kt = first + '\n' + textwrap.dedent(kt[len(first):])
              open(a, 'w', encoding='utf-8').write(kt)
          EOF
      - name: Icône LC STUDIO (optionnelle)
        continue-on-error: true
        run: |
          pip install --break-system-packages pillow || true
          python3 - <<'EOF'
          import os, math
          from PIL import Image, ImageDraw
          S = 1024
          img = Image.new('RGB', (S, S))
          d = ImageDraw.Draw(img)
          top, bot = (11, 18, 38), (22, 30, 56)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=tuple(int(top[i] + (bot[i] - top[i]) * t) for i in range(3)))
          accent = (79, 195, 247)
          B = 0.56 * S
          ox = oy = 0.22 * S
          d.rounded_rectangle([ox, oy, ox + B, oy + B], radius=0.28 * B,
                              outline=accent, width=int(0.04 * B))
          w = int(0.075 * B)
          def pt(x, y): return (ox + x * B, oy + y * B)
          def dot(p):
              d.ellipse([p[0] - w / 2, p[1] - w / 2, p[0] + w / 2, p[1] + w / 2], fill=accent)
          a, b, c = pt(0.30, 0.26), pt(0.30, 0.72), pt(0.54, 0.72)
          d.line([a, b, c], fill=accent, width=w, joint='curve')
          for p in (a, b, c): dot(p)
          cx, cy = pt(0.60, 0.49)
          r = 0.21 * B
          d.arc([cx - r, cy - r, cx + r, cy + r], start=45, end=315, fill=accent, width=w)
          for deg in (45, 315):
              dot((cx + r * math.cos(math.radians(deg)), cy + r * math.sin(math.radians(deg))))
          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S, S], radius=int(0.22 * S), fill=255)
          img = img.convert('RGBA')
          img.putalpha(mask)
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, size in sizes.items():
              folder = f'android/app/src/main/res/mipmap-{name}'
              if os.path.isdir(folder):
                  img.resize((size, size), Image.LANCZOS).save(f'{folder}/ic_launcher.png')
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - name: Vérifier qu'il n'y a aucun accès Internet
        run: |
          F=$(find build -path '*merged_manifests*' -path '*release*' -name AndroidManifest.xml | head -1)
          if [ -z "$F" ]; then echo "Manifest fusionné introuvable (contrôle ignoré)"; exit 0; fi
          echo "Contrôle : $F"
          if grep -q 'android.permission.INTERNET' "$F"; then
            echo "ERREUR : permission INTERNET présente"; exit 1
          fi
          echo "OK : aucune permission Internet"
      - uses: actions/upload-artifact@v4
        with:
          name: tri-photos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
